<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Document — DocVault</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .page-wrap { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .page-header { margin-bottom: 2rem; }
    .page-header h1 { font-size: 2.2rem; margin-bottom: 0.3rem; }
    .page-header p  { font-size: 0.78rem; color: var(--text-muted); }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--surface);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--gold);
      background: var(--gold-dim);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon {
      width: 56px; height: 56px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; color: var(--gold);
      transition: transform var(--transition);
    }
    .drop-zone:hover .drop-icon { transform: translateY(-3px); }
    .drop-zone h3 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .drop-zone p  { font-size: 0.75rem; color: var(--text-muted); }

    .file-preview {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-top: 1rem;
      display: none;
      align-items: center;
      gap: 0.75rem;
    }
    .file-preview.show { display: flex; }
    .file-preview-icon { font-size: 1.5rem; }
    .file-preview-info { flex: 1; min-width: 0; }
    .file-preview-name { font-size: 0.82rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-preview-size { font-size: 0.68rem; color: var(--text-muted); }
    .file-clear { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0.2rem; }
    .file-clear:hover { color: var(--danger); }

    /* ── Progress ── */
    .progress-wrap { margin-top: 1.25rem; display: none; }
    .progress-wrap.show { display: block; }
    .progress-bar-track {
      height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--gold); border-radius: 2px;
      width: 0%; transition: width 0.3s ease;
    }
    .progress-label { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.4rem; }

    .allowed-types {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem;
    }
    .type-pill {
      font-size: 0.62rem; padding: 0.25rem 0.6rem;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-muted); letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <nav class="vault-nav" id="main-nav"></nav>

  <div class="page-wrap">
    <div class="page-header fade-up">
      <h1>Upload Document</h1>
      <p>Add a new file to your secure vault</p>
    </div>

    <div class="card fade-up-2">
      <div id="upload-alert" class="alert"></div>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.webp" onchange="handleFileSelect(this)"/>
        <div class="drop-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <h3>Drop your file here</h3>
        <p>or click to browse from your device</p>
        <div class="allowed-types" style="justify-content:center; margin-top:1rem">
          <span class="type-pill">PDF</span>
          <span class="type-pill">DOCX</span>
          <span class="type-pill">JPG</span>
          <span class="type-pill">PNG</span>
          <span class="type-pill">GIF</span>
          <span class="type-pill">WEBP</span>
          <span class="type-pill">Max 5 MB</span>
        </div>
      </div>

      <div class="file-preview" id="file-preview">
        <div class="file-preview-icon" id="preview-icon">📄</div>
        <div class="file-preview-info">
          <div class="file-preview-name" id="preview-name">—</div>
          <div class="file-preview-size" id="preview-size">—</div>
        </div>
        <button class="file-clear" onclick="clearFile()" title="Remove">✕</button>
      </div>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">Uploading…</div>
      </div>

      <button class="btn btn-primary w-full mt-3" id="upload-btn" onclick="handleUpload()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span id="upload-btn-text">Select a File First</span>
        <span id="upload-spinner" class="spinner" style="display:none"></span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    injectNav('upload');
    requireAuth();

    let selectedFile = null;

    // Drag & drop
    const zone = document.getElementById('drop-zone');
    zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) setFile(file);
    });

    function handleFileSelect(input) {
      if (input.files[0]) setFile(input.files[0]);
    }

    const ICONS = { 'application/pdf': '📕', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '📘', 'image/': '🖼️' };

    function setFile(file) {
      const MAX = 5 * 1024 * 1024;
      const ALLOWED = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/msword', 'image/jpeg', 'image/png', 'image/gif', 'image/webp'];

      if (!ALLOWED.includes(file.type)) {
        showAlert('upload-alert', 'File type not allowed. Upload PDF, DOCX, or image files only.', 'danger');
        return;
      }
      if (file.size > MAX) {
        showAlert('upload-alert', `File too large (${fmtSize(file.size)}). Maximum size is 5 MB.`, 'danger');
        return;
      }

      selectedFile = file;
      document.getElementById('preview-name').textContent = file.name;
      document.getElementById('preview-size').textContent = fmtSize(file.size);
      let icon = '📄';
      if (file.type === 'application/pdf') icon = '📕';
      else if (file.type.includes('word')) icon = '📘';
      else if (file.type.startsWith('image/')) icon = '🖼️';
      document.getElementById('preview-icon').textContent = icon;
      document.getElementById('file-preview').classList.add('show');

      const btn = document.getElementById('upload-btn');
      btn.disabled = false;
      document.getElementById('upload-btn-text').textContent = 'Upload to Vault';
    }

    function clearFile() {
      selectedFile = null;
      document.getElementById('file-input').value = '';
      document.getElementById('file-preview').classList.remove('show');
      document.getElementById('upload-btn').disabled = true;
      document.getElementById('upload-btn-text').textContent = 'Select a File First';
    }

    async function handleUpload() {
      if (!selectedFile) return;

      const btn     = document.getElementById('upload-btn');
      const btnText = document.getElementById('upload-btn-text');
      const spinner = document.getElementById('upload-spinner');
      const progWrap = document.getElementById('progress-wrap');
      const progFill = document.getElementById('progress-fill');
      const progLabel = document.getElementById('progress-label');

      btn.disabled = true;
      btnText.textContent = 'Uploading…';
      spinner.style.display = 'inline-block';
      progWrap.classList.add('show');

      // Simulate progress
      let prog = 0;
      const ticker = setInterval(() => {
        prog = Math.min(prog + Math.random() * 15, 85);
        progFill.style.width = prog + '%';
      }, 200);

      try {
        const formData = new FormData();
        formData.append('document', selectedFile);

        const token = Auth.getToken();
        const res = await fetch('http://localhost:5000/api/documents/upload', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Upload failed.');

        clearInterval(ticker);
        progFill.style.width = '100%';
        progLabel.textContent = 'Upload complete!';
        showAlert('upload-alert', `✓ "${selectedFile.name}" uploaded successfully.`, 'success');
        clearFile();
        setTimeout(() => { progWrap.classList.remove('show'); progFill.style.width = '0%'; }, 2500);
      } catch (err) {
        clearInterval(ticker);
        showAlert('upload-alert', err.message, 'danger');
        progWrap.classList.remove('show');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Upload to Vault';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
