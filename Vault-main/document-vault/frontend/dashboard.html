<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — DocVault</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    /* ── Stats bar ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.4rem 1.6rem;
      display: flex; align-items: center; gap: 1rem;
      transition: border-color var(--transition);
    }
    .stat-card:hover { border-color: var(--border-light); }
    .stat-icon {
      width: 42px; height: 42px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      color: var(--gold); flex-shrink: 0;
    }
    .stat-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
    .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; line-height: 1.1; color: var(--text); }

    /* ── Section header ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .section-header h2 { font-size: 1.4rem; }

    /* ── Document table ── */
    .doc-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface-2); }
    th {
      padding: 0.85rem 1.25rem;
      text-align: left;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.95rem 1.25rem;
      font-size: 0.78rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background var(--transition); }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    .file-name { font-weight: 500; color: var(--text); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state svg { margin-bottom: 1rem; opacity: 0.3; }
    .empty-state h3 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--text); }
    .empty-state p  { font-size: 0.78rem; }

    /* ── Action btn group ── */
    .action-group { display: flex; gap: 0.5rem; }

    @media (max-width: 640px) {
      .col-hide { display: none; }
    }
  </style>
</head>
<body>
  <nav class="vault-nav" id="main-nav"></nav>

  <div class="page-wrap">
    <!-- Stats -->
    <div class="stats-grid fade-up" id="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div>
          <div class="stat-label">Total Documents</div>
          <div class="stat-value" id="stat-count">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: rgba(52,152,219,0.1); border-color: rgba(52,152,219,0.2); color: #3498db;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <div>
          <div class="stat-label">Total Size</div>
          <div class="stat-value" id="stat-size">—</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: rgba(39,174,96,0.1); border-color: rgba(39,174,96,0.2); color: #2ecc71;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <div class="stat-label">Vault Status</div>
          <div class="stat-value" style="font-size:1.1rem; padding-top:0.2rem; color: #2ecc71;">Secured</div>
        </div>
      </div>
    </div>

    <!-- Documents table -->
    <div class="fade-up-2">
      <div class="section-header">
        <h2>Recent Documents</h2>
        <a href="upload.html" class="btn btn-primary btn-sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Upload New
        </a>
      </div>

      <div class="doc-table-wrap" id="doc-table-wrap">
        <div class="empty-state">
          <div class="spinner"></div>
          <p class="mt-2">Loading documents…</p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    injectNav('dashboard');
    requireAuth();

    const user = Auth.getUser();

    async function loadDocuments() {
      const wrap = document.getElementById('doc-table-wrap');
      try {
        const data = await apiFetch('/documents');
        const docs = data.documents || [];

        // Update stats
        const totalSize = docs.reduce((s, d) => s + (d.file_size || 0), 0);
        document.getElementById('stat-count').textContent = docs.length;
        document.getElementById('stat-size').textContent  = fmtSize(totalSize);

        if (docs.length === 0) {
          wrap.innerHTML = `
            <div class="empty-state">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
              </svg>
              <h3>No documents yet</h3>
              <p>Upload your first file to get started.</p>
              <a href="upload.html" class="btn btn-primary mt-2">Upload a Document</a>
            </div>`;
          return;
        }

        wrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>File Name</th>
                <th>Type</th>
                <th class="col-hide">Size</th>
                <th class="col-hide">Uploaded</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${docs.map(doc => `
                <tr>
                  <td><div class="file-name" title="${doc.file_name}">${doc.file_name}</div></td>
                  <td>${typeBadge(doc.file_type)}</td>
                  <td class="col-hide text-muted">${fmtSize(doc.file_size)}</td>
                  <td class="col-hide text-muted">${fmtDate(doc.upload_date)}</td>
                  <td>
                    <div class="action-group">
                      <button class="btn btn-outline btn-sm" onclick="downloadDoc(${doc.id}, '${doc.file_name.replace(/'/g,"\\'")}')">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download
                      </button>
                      <button class="btn btn-danger btn-sm" onclick="deleteDoc(${doc.id}, this)">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                        Delete
                      </button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (err) {
        wrap.innerHTML = `<div class="empty-state"><p style="color:var(--danger)">Failed to load: ${err.message}</p></div>`;
      }
    }

    async function downloadDoc(id, name) {
      const token = Auth.getToken();
      const res   = await fetch(`${API}/documents/download/${id}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) { alert('Download failed.'); return; }
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = name;
      a.click(); URL.revokeObjectURL(url);
    }

    async function deleteDoc(id, btn) {
      if (!confirm('Permanently delete this document?')) return;
      btn.disabled = true;
      try {
        await apiFetch(`/documents/${id}`, { method: 'DELETE' });
        loadDocuments();
      } catch (err) {
        alert('Delete failed: ' + err.message);
        btn.disabled = false;
      }
    }

    const API = 'http://localhost:5000/api';
    loadDocuments();
  </script>
</body>
</html>
