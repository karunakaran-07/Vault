<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — DocVault</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-wrap {
      min-height: calc(100vh - 64px);
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 1rem;
      position: relative;
    }
    .auth-wrap::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 65% 40%, rgba(201,168,76,0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-box { width: 100%; max-width: 420px; }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-icon {
      width: 56px; height: 56px;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem;
      color: var(--gold);
    }
    .auth-header h1 { font-size: 2rem; margin-bottom: 0.4rem; }
    .auth-header p  { font-size: 0.78rem; color: var(--text-muted); }
    .divider { border-color: var(--border); margin: 1.5rem 0; }
  </style>
</head>
<body>
  <nav class="vault-nav" id="main-nav"></nav>

  <div class="auth-wrap">
    <div class="auth-box fade-up">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to access your vault</p>
      </div>

      <div class="card">
        <div id="login-alert" class="alert"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="jane@example.com" required autocomplete="email"/>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Your password" required autocomplete="current-password"/>
            <div style="text-align:right; margin-top:0.4rem"><a href="forgot-password.html" style="font-size:0.72rem; color:var(--text-muted)">Forgot password?</a></div>
          </div>

          <button type="submit" class="btn btn-primary w-full mt-2" id="login-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span id="login-btn-text">Unlock Vault</span>
            <span id="login-spinner" class="spinner" style="display:none"></span>
          </button>
        </form>

        <hr class="divider"/>
        <p class="text-center text-sm text-muted">
          New here? <a href="register.html">Create an account</a>
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    injectNav('login');
    redirectIfAuth();

    async function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const btn     = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-spinner');

      btn.disabled = true;
      btnText.textContent = 'Unlocking…';
      spinner.style.display = 'inline-block';

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        Auth.setSession(data.token, data.user);
        window.location.href = 'documents.html';
      } catch (err) {
        showAlert('login-alert', err.message, 'danger');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Unlock Vault';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
